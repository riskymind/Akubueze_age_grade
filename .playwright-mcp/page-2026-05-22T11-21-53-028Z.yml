                - generic [ref=e139]:
                  - img [ref=e140]
                  - paragraph [ref=e142]: Annual General Meeting — Save the Date
                - paragraph [ref=e143]: Dear members, the Akubueze Age Grade Annual General Meeting is scheduled for Sat Jun 06 2026 at Victory Hall, Rumuola, Port Harcourt. Attendance is compulsory for all active members. The formal agenda will be circulated one week before the meeting. Members who cannot attend must notify the Secretary General in advance.
                - paragraph [ref=e144]: 27 days ago
              - listitem [ref=e145]:
                - generic [ref=e146]:
                  - img [ref=e147]
                  - paragraph [ref=e149]: Community Borehole Project — Levy Collection
                - paragraph [ref=e150]: The executive committee has unanimously approved a development levy of ₦5,000 per member toward the construction of a community borehole on Rumuola Road. This is a mandatory contribution. Payment deadline is end of March. Contact the Treasurer to make your payment.
                - paragraph [ref=e151]: 4 months ago
              - listitem [ref=e152]:
                - generic [ref=e153]:
                  - img [ref=e154]
                  - paragraph [ref=e156]: Welcome to Akubueze Online Portal
                - paragraph [ref=e157]: Dear members, we are pleased to announce the launch of the Akubueze digital management platform. All members are encouraged to log in using the credentials provided and update your profiles. For login issues, please contact the Secretary General.
                - paragraph [ref=e158]: 6 months ago
              - listitem [ref=e159]:
                - paragraph [ref=e161]: July Meeting Dues — Payment Deadline
                - paragraph [ref=e162]: This is a reminder that July meeting dues are now outstanding. The host pays ₦5,000; all other members pay ₦1,000. Members who have not paid by end of month will attract a ₦1,500 fine. Please make payment to the Treasurer and collect your receipt. Thank you.
                - paragraph [ref=e163]: 13 days ago
              - listitem [ref=e164]:
                - paragraph [ref=e166]: Misconduct Hearing Outcome
                - paragraph [ref=e167]: Following the emergency meeting held in April, the executive committee has concluded proceedings relating to the misconduct report. A member has been placed on suspension pending a formal review. Full details were communicated at the meeting. Members with questions should direct them to the President.
                - paragraph [ref=e168]: 3 months ago
